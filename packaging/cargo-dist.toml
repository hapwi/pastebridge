name = "pastebridge"
binaries = ["pastebridge"]
repository = { repo = "hapwi/pastebridge", provider = "github" }
homepage = "https://github.com/hapwi/pastebridge"

[package.metadata.deb]
maintainer = "hapwi"
copyright = "2026"
extended-description = "Copy on macOS, paste on Linux. Local encrypted clipboard sync."
depends = "$auto"
section = "utils"
priority = "optional"

[package.metadata.generate-rpm]
license = "MIT"
summary = "Encrypted clipboard sync for macOS and Linux"
assets = [
  { source = "target/release/pastebridge", dest = "/usr/bin/pastebridge", mode = "755" },
]
