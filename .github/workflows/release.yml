name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: pastebridge-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux clipboard tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Import hapwi signing cert
        if: runner.os == 'macOS'
        env:
          MACOS_SELFSIGN_P12_BASE64: ${{ secrets.MACOS_SELFSIGN_P12_BASE64 }}
          MACOS_SELFSIGN_P12_PASSWORD: ${{ secrets.MACOS_SELFSIGN_P12_PASSWORD }}
        run: bash scripts/macos-import-cert.sh
      - name: Codesign macOS binary
        if: runner.os == 'macOS'
        run: |
          BIN="target/${{ matrix.target }}/release/pastebridge"
          codesign --force --sign "hapwi Pastebridge" \
            --identifier com.hapwi.pastebridge \
            --timestamp=none \
            "$BIN"
          codesign --verify --verbose=2 "$BIN"
          codesign -dv --verbose=4 "$BIN" 2>&1 | grep -E 'Authority|Identifier'
      - name: Verify packaged executable
        run: target/${{ matrix.target }}/release/pastebridge --version
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/pastebridge" dist/pastebridge
          chmod 755 dist/pastebridge
          tar -C dist -czf "pastebridge-${{ matrix.target }}.tar.gz" pastebridge
      - uses: actions/upload-artifact@v4
        with:
          name: pastebridge-${{ matrix.target }}
          path: pastebridge-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$RELEASE_TAG" = "v$version"
      - name: Checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(pastebridge-*.tar.gz)
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            test -s "pastebridge-${target}.tar.gz"
          done
          test "${#files[@]}" -eq 3
          sha256sum "${files[@]}" | tee SHA256SUMS
      - name: Publish complete versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != true ]]; then
              echo "Refusing to overwrite the published release $RELEASE_TAG"
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag --draft \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
